name: 설치 파일 빌드 (Windows · macOS)

# Windows 러너에서 빌드하면 wine 없이 그대로 설치 파일이 만들어진다.
# macOS 설치 파일(.dmg, Apple Silicon)은 macOS 러너에서만 만들 수 있다.
# 결과물은 Actions 실행 페이지의 Artifacts 에서 내려받을 수 있고,
# 태그를 밀면 릴리스에도 첨부된다.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다 (러너가 쌓이지 않도록).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

      - name: E2E 시뮬레이션 (실제 Electron 창)
        timeout-minutes: 15
        run: xvfb-run -a npm run test:e2e

      - name: 실패 시 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  build-windows:
    name: 설치 파일 빌드 (Windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run dist:win
      - run: npm run verify:installer

      - name: 설치 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MarkView-Windows
          path: |
            release/*Setup.exe
            release/*Portable.exe
          retention-days: 30

      - name: 릴리스에 첨부 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*Setup.exe
            release/*Portable.exe

  build-mac:
    name: 설치 파일 빌드 (macOS · Apple Silicon)
    needs: test
    runs-on: macos-latest   # arm64 러너
    timeout-minutes: 40
    env:
      # 러너 키체인의 인증서를 찾지 않는다 (서명은 afterPack 의 ad-hoc 서명으로 대신).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run dist:mac

      - name: 서명·아키텍처 확인
        run: |
          APP="release/mac-arm64/MarkView.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/MarkView" | grep -qw arm64
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleDocumentTypes' 
          ls -lh release/*.dmg release/*.zip

      - name: E2E 시뮬레이션 (패키징된 macOS 앱)
        timeout-minutes: 15
        run: node scripts/run-e2e.mjs --packaged release/mac-arm64

      - name: 실패 시 스크린샷 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-mac
          path: test-results/
          retention-days: 7

      - name: 설치 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MarkView-macOS
          path: |
            release/*.dmg
            release/*-mac-arm64.zip
          retention-days: 30

      - name: 릴리스에 첨부 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*-mac-arm64.zip
