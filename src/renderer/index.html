<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: md-asset:; media-src 'self' data: blob: md-asset:; connect-src 'self' data: blob: md-asset:;"
    />
    <title>MarkView</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="app" data-view="split">
      <!-- 툴바 -->
      <header class="toolbar" role="toolbar" aria-label="도구 모음">
        <div class="toolbar-group">
          <button class="tb" data-cmd="file:new" title="새 문서 (Ctrl+N)" aria-label="새 문서">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 2H5.5A1.5 1.5 0 0 0 4 3.5v13A1.5 1.5 0 0 0 5.5 18h9a1.5 1.5 0 0 0 1.5-1.5V7l-5-5Z"/><path class="fg" d="M11 2v4.5A.5.5 0 0 0 11.5 7H16"/></svg>
          </button>
          <button class="tb" data-cmd="file:open" title="열기 (Ctrl+O)" aria-label="열기">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5A1.5 1.5 0 0 1 4 4h3.3l1.4 1.6H16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 16 16.6H4a1.5 1.5 0 0 1-1.5-1.5v-9.6Z"/></svg>
          </button>
          <button class="tb" data-cmd="file:save" title="저장 (Ctrl+S)" aria-label="저장">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4A1.5 1.5 0 0 1 5 2.5h8.2L17.5 6.8V16A1.5 1.5 0 0 1 16 17.5H5A1.5 1.5 0 0 1 3.5 16V4Z"/><path class="fg" d="M6.5 2.5v4h6v-4M6.5 17.5v-5h7v5"/></svg>
          </button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
          <button class="tb" data-cmd="format:bold" title="굵게 (Ctrl+B)" aria-label="굵게"><b>B</b></button>
          <button class="tb" data-cmd="format:italic" title="기울임 (Ctrl+I)" aria-label="기울임"><i>I</i></button>
          <button class="tb" data-cmd="format:strike" title="취소선" aria-label="취소선"><s>S</s></button>
          <button class="tb" data-cmd="format:code" title="인라인 코드 (Ctrl+`)" aria-label="인라인 코드"><code>&lt;&gt;</code></button>
          <button class="tb" data-cmd="format:heading" title="제목 수준 올리기" aria-label="제목">H</button>
          <button class="tb" data-cmd="format:ul" title="글머리 기호 목록" aria-label="목록">•≡</button>
          <button class="tb" data-cmd="format:task" title="체크리스트" aria-label="체크리스트">☑</button>
          <button class="tb" data-cmd="format:quote" title="인용" aria-label="인용">❝</button>
          <button class="tb" data-cmd="format:link" title="링크 (Ctrl+K)" aria-label="링크">🔗</button>
          <button class="tb" data-cmd="format:table" title="표 삽입" aria-label="표">▦</button>
          <button class="tb" data-cmd="format:mermaid" title="Mermaid 다이어그램 삽입" aria-label="다이어그램">◈</button>
        </div>

        <div class="toolbar-spacer"></div>

        <div class="toolbar-group segmented" role="group" aria-label="보기 모드">
          <button class="tb seg" data-cmd="view:editor" title="편집기만 (Ctrl+1)">편집</button>
          <button class="tb seg" data-cmd="view:split" title="나란히 보기 (Ctrl+2)">분할</button>
          <button class="tb seg" data-cmd="view:preview" title="미리보기만 (Ctrl+3)">미리보기</button>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group">
          <button class="tb" data-cmd="view:outline" title="목차 패널 (Ctrl+\)" aria-label="목차">☰</button>
          <button class="tb" data-cmd="view:toggleTheme" title="테마 전환 (Ctrl+Shift+T)" aria-label="테마 전환">◐</button>
          <button class="tb" data-cmd="export:menu" title="내보내기" aria-label="내보내기">⤓</button>
        </div>
      </header>

      <!-- 탭 -->
      <nav class="tabbar" id="tabbar" aria-label="열린 문서"></nav>

      <!-- 작업 영역 -->
      <main class="workspace">
        <aside class="outline-pane" id="outlinePane" aria-label="문서 목차">
          <div class="outline-head">목차</div>
          <div class="outline-list" id="outlineList"></div>
        </aside>

        <div class="panes" id="panes">
          <section class="pane editor-pane" id="editorPane" aria-label="편집기">
            <div id="editor"></div>
          </section>
          <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
          <section class="pane preview-pane" id="previewPane" aria-label="미리보기">
            <div class="preview-scroll" id="previewScroll">
              <article class="markdown-body" id="preview"></article>
            </div>
          </section>
        </div>
      </main>

      <!-- 상태바 -->
      <footer class="statusbar">
        <span class="status-item" id="statusPath" title="파일 경로">새 문서</span>
        <span class="status-spacer"></span>
        <span class="status-item" id="statusDiagram" hidden></span>
        <span class="status-item" id="statusCursor">1:1</span>
        <span class="status-item" id="statusCount">0 단어</span>
        <span class="status-item" id="statusRead"></span>
        <span class="status-item" id="statusZoom">100%</span>
      </footer>
    </div>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="modal-actions"><button class="btn primary" id="modalClose">닫기</button></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
